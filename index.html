<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts">
        <div style="top: 10%; left: 20%; animation-duration: 10s;"></div>
        <div style="top: 30%; left: 50%; animation-duration: 12s;"></div>
        <div style="top: 50%; left: 70%; animation-duration: 8s;"></div>
        <div style="top: 70%; left: 30%; animation-duration: 14s;"></div>
        <div style="top: 90%; left: 80%; animation-duration: 10s;"></div>
        <div style="top: 15%; left: 25%; animation-duration: 16s;"></div>
        <div style="top: 40%; left: 60%; animation-duration: 18s;"></div>
        <div style="top: 60%; left: 75%; animation-duration: 9s;"></div>
        <div style="top: 80%; left: 40%; animation-duration: 13s;"></div>
        <div style="top: 95%; left: 20%; animation-duration: 11s;"></div>
    </div>

    <button class="menu-btn" onclick="toggleMenu()">≡</button>

    <div id="menu" class="menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">×</a>
        <div class="color-selector">
            <label for="vignetteColor">Selecciona el color del Vignette:</label>
            <input type="color" id="vignetteColor" name="vignetteColor" value="#ff69b4">
        </div>
        <div class="intensity-selector">
            <label for="vignetteIntensity">Intensidad del Vignette:</label>
            <input type="range" id="vignetteIntensity" name="vignetteIntensity" min="0.1" max="1" step="0.01" value="0.7">
        </div>
        <div class="bgcolor-selector">
            <label for="bgcolor">Selecciona el color de fondo:</label>
            <input type="color" id="bgcolor" name="bgcolor" value="#ffcccb">
        </div>
    </div>

    <div class="logo">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_160x56dp.png" alt="Google Logo">
    </div>

    <div class="search-bar">
        <form id="searchForm" action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Buscar en Google..." required>
            <button type="submit">Buscar</button>
        </form>
    </div>

    <div class="favorites">
        <a href="https://www.youtube.com" target="_blank"><img src="https://img.icons8.com/color/48/000000/youtube-play.png" alt="YouTube">YouTube</a>
         <a href="https://www.facebook.com" target="_blank"><img src="https://img.icons8.com/color/48/000000/facebook.png" alt="Facebook">Facebook</a>
         <a href="https://www.gmail.com" target="_blank"><img src="https://img.icons8.com/color/48/000000/gmail-new.png" alt="Gmail">Gmail</a>
         <a href="https://www.instagram.com" target="_blank"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram">Instagram</a>
     </div>

    <div class="quote" id="quote">
        <!-- Aquí va la frase aleatoria del día -->
    </div>

    <div class="vignette"></div>

    <script src="script.js"></script>
</body>
</html>
